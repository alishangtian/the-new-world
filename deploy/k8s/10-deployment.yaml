# the-new-world 平台：控制台（静态）+ MCP HTTP 端点（POST /mcp）
# 无状态单副本；镜像由仓库 Dockerfile 构建（见 deploy/k8s/README.md）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-new-world
  namespace: the-new-world
  labels:
    app.kubernetes.io/name: the-new-world
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: the-new-world
  template:
    metadata:
      labels:
        app.kubernetes.io/name: the-new-world
    spec:
      containers:
        - name: platform
          image: the-new-world:0.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
