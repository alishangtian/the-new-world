name: 世界体检

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 静态语法检查
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: 世界体检（数据/契约/无头渲染/拾取回归）
        run: node scripts/verify.mjs
      - name: 数据采集脚本可运行性（干跑校验参数）
        run: python3 -m py_compile scripts/fetch_data.py
