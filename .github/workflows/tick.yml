name: 平台心跳

# P9 自主触发：心跳只发令，施工交给接入的 agent（run_gates/write_ledger 等 MCP 工具）。
# 观测模式（--dry）：只决策不落盘，把"将派发什么"打进日志。
# 接入 agent runner 后，可把心跳升级为完整循环（见 ORD-015 互操作层）。

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 01:00（北京 09:00）
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 心跳派单（观测模式）
        run: node platform/scheduler.mjs --dry --json
